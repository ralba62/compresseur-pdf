name: Construire les applications

on:
  workflow_dispatch:        # bouton « Run workflow » manuel
  push:
    tags: ["v*"]            # ou création d'une version (ex. v1.0.0)

permissions:
  contents: write           # nécessaire pour publier la Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            nom: Mac-Intel
            icone: icones/icone.icns
          - os: macos-15
            nom: Mac-Apple-Silicon
            icone: icones/icone.icns
          - os: windows-latest
            nom: Windows
            icone: icones/icone.ico
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip pypdf pillow pyinstaller

      - name: Construire l'application
        run: python -m PyInstaller --windowed --icon "${{ matrix.icone }}" --name "Compresseur PDF" compresseur_pdf.py

      - name: Compresser (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "Compresseur PDF.app" "../Compresseur-PDF-${{ matrix.nom }}.zip"

      - name: Compresser (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Compresseur PDF" -DestinationPath "Compresseur-PDF-${{ matrix.nom }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Compresseur-PDF-${{ matrix.nom }}
          path: Compresseur-PDF-${{ matrix.nom }}.zip

  publier:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: zips
          merge-multiple: true

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" zips/*.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
